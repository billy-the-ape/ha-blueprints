blueprint:
  name: Repeat any actions until a state is resolved
  description: >-
    Start from any user-configured Home Assistant trigger, run optional start
    actions once, repeat any user-configured actions while a monitored entity
    remains active, and run optional end actions once when that entity reaches
    its resolved state or the configured maximum loop count is reached.
    Repeating actions can use {{ loop_index }} or {{ repeat.index }} in
    templates.
  domain: automation
  author: billy-the-ape and OpenAI
  homeassistant:
    min_version: 2024.10.0
  input:
    trigger_settings:
      name: When
      icon: mdi:play
      input:
        start_triggers:
          name: Start trigger(s)
          description: >-
            Configure anything Home Assistant can use as a trigger. For example,
            select a state trigger and require a door sensor to remain open for
            20 minutes.
          selector:
            trigger:

    state_settings:
      name: Until
      icon: mdi:repeat
      input:
        monitored_entity:
          name: Monitored entity
          description: The binary sensor, input boolean, or switch that keeps the loop active.
          selector:
            entity:
              filter:
                - domain: binary_sensor
                - domain: input_boolean
                - domain: switch

        active_state:
          name: Active/error state
          description: Repeating actions continue while the monitored entity has this state.
          default: "on"
          selector:
            text:

        resolved_state:
          name: Resolved/end state
          description: Reaching this state ends the loop and runs the end actions.
          default: "off"
          selector:
            text:

        loop_interval:
          name: Loop interval
          description: >-
            Maximum wait after one repeating action group finishes and before the
            next starts. Resolution ends this wait immediately.
          default:
            hours: 0
            minutes: 1
            seconds: 0
          selector:
            duration:

        max_loops:
          name: Maximum loops
          description: >-
            Maximum number of repeating iterations before forcing the loop to end
            and running the end actions. Use 0 for unlimited.
          default: 0
          selector:
            number:
              min: 0
              max: 1000
              mode: box

    action_settings:
      name: Action groups
      icon: mdi:play-box-multiple
      input:
        start_actions:
          name: Start actions
          description: Run once after a configured start trigger fires, before iteration 1.
          default: []
          selector:
            action:

        repeating_actions:
          name: Active/error-state actions
          description: >-
            Run once per iteration while the entity remains active. Templates in
            these actions may use {{ loop_index }} or {{ repeat.index }}; numbering
            begins at 1.
          default: []
          selector:
            action:

        end_actions:
          name: End/resolved-state actions
          description: >-
            Run once after the monitored entity resolves or the maximum loop
            count is reached.
          default: []
          selector:
            action:

variables:
  watched_entity: !input monitored_entity
  error_state: !input active_state
  end_state: !input resolved_state
  max_loop_count: !input max_loops

triggers:
  - triggers: !input start_triggers

conditions:
  - condition: template
    value_template: "{{ is_state(watched_entity, error_state) }}"

actions:
  - alias: Run start actions once
    sequence: !input start_actions

  - alias: Repeat configured actions while the error state remains active
    repeat:
      while:
        - condition: template
          value_template: >-
            {{
              is_state(watched_entity, error_state)
              and (
                max_loop_count | int(0) == 0
                or repeat.index <= max_loop_count | int(0)
              )
            }}
      sequence:
        - variables:
            loop_index: "{{ repeat.index }}"

        - alias: Run active/error-state actions
          sequence: !input repeating_actions

        - alias: Wait until resolution or the next interval
          wait_template: "{{ is_state(watched_entity, end_state) }}"
          timeout: !input loop_interval
          continue_on_timeout: true

        # A completed wait means the entity resolved. Ending this iteration lets
        # the while condition re-evaluate false and exit the loop.
        - condition: template
          value_template: "{{ not wait.completed }}"

  - alias: Run end actions once
    sequence: !input end_actions

mode: restart
max_exceeded: silent
